name: Volume Backup

on: 
  workflow_call:
    inputs:
      serverName:
        type: string
        required: true
      volumeName:
        type: string
        required: true
      volumePath:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      serverName:
        description: 'Server name'
        type: string
        required: true
      volumeName:
        description: 'Docker volume name'
        type: string
        required: true
      volumePath:
        description: 'Volume mount path inside container'
        type: string
        required: true

jobs:
  backup:
    name: Backup Volume
    runs-on: ubuntu-latest
    env:
      BACKUP_FILE: ${{ inputs.volumeName }}-backup-${{ github.run_id }}.tar
    steps:
      - name: Create backup
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ inputs.serverName }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.DOCKER_SSH_PRIVATE_KEY }}
          envs: BACKUP_FILE
          script: |
            # Create the backup using docker
            docker run --rm \
              -v ${{ inputs.volumeName }}:${{ inputs.volumePath }} \
              -v $(pwd):/backup \
              busybox:1.37.0 \
              sh -c "cd ${{ inputs.volumePath }} && tar cf /backup/${BACKUP_FILE} .";

      - name: Download backup file
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ inputs.serverName }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.DOCKER_SSH_PRIVATE_KEY }}
          source: "~/${{ env.BACKUP_FILE }}"
          target: "~/"
          strip_components: 1

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: volume-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 5